<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeesFoundry - Keygen</title>
  <link rel="stylesheet" href="styles.css">
  <!-- jsQR for QR Code scanning -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <div class="background"></div>
  
  <div class="container" id="login-container">
    <div class="card">
      <div class="logo">
        <img src="schoolfoundry-logo.svg" alt="SchoolFoundry" style="height: 48px; border-radius: 8px;">
        <h1>FeesFoundry</h1>
      </div>
      <h2>Admin Login</h2>
      <p class="subtitle">Access the license key generator</p>
      
      <form id="login-form">
        <div class="input-group">
          <label for="password">Master Password</label>
          <input type="password" id="password" placeholder="Enter admin password" required>
        </div>
        <button type="submit" class="btn primary">Login</button>
        <p id="login-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <div class="container hidden" id="keygen-container" style="max-width: 600px;">
    <div class="card keygen-card">
      <div class="header">
        <div class="logo small">
          <img src="schoolfoundry-logo.svg" alt="SchoolFoundry" style="height: 24px; border-radius: 4px;">
          <h2>License Generator</h2>
        </div>
        <button id="logout-btn" class="btn text">Logout</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-target="tab-generate">Generate Key</button>
        <button class="tab" data-target="tab-history" id="history-tab-btn">History</button>
      </div>

      <div class="tab-content active" id="tab-generate">
        <div class="input-group">
          <label for="client-name">Client / School Name</label>
          <input type="text" id="client-name" placeholder="e.g. Pretoria Boys High" required>
        </div>

        <div class="tabs" style="margin-top: 16px;">
          <button class="sub-tab active" data-target="sub-tab-manual">Manual Entry</button>
          <button class="sub-tab" data-target="sub-tab-qr">QR Code Upload</button>
        </div>

        <div class="sub-tab-content active" id="sub-tab-manual">
          <div class="input-group">
            <label for="machine-id">Machine ID</label>
            <input type="text" id="machine-id" placeholder="Paste Machine ID here">
          </div>
        </div>

        <div class="sub-tab-content" id="sub-tab-qr">
          <div class="upload-area" id="drop-zone">
            <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <p>Drag & drop QR code image here</p>
            <span>or</span>
            <label for="file-upload" class="btn outline small">Browse Files</label>
            <input type="file" id="file-upload" accept="image/*" class="hidden">
          </div>
          <p id="qr-result" class="qr-result"></p>
        </div>

        <button id="generate-btn" class="btn primary full-width" style="margin-top: 16px;">Generate License Key</button>

        <div class="result-area hidden" id="result-area">
          <label>Activation Key</label>
          <div class="key-box">
            <code id="license-key-display"></code>
            <button id="copy-btn" class="icon-btn" title="Copy to clipboard">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>
        </div>
        <p class="error-msg" id="generate-error"></p>
      </div>

      <div class="tab-content" id="tab-history">
        <div id="history-list" class="history-list">
          <p class="text-muted text-center">Loading history...</p>
        </div>
      </div>

    </div>
  </div>

  <canvas id="canvas" hidden></canvas>
  
  <script src="app.js"></script>
</body>
</html>
