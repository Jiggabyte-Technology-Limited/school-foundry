<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Focus ring (outer) -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Focus ring (middle) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  
  <!-- Letter F -->
  <g fill="currentColor">
    <!-- Vertical bar -->
    <rect x="20" y="14" width="4.5" height="29" rx="1"/>
    
    <!-- Top horizontal bar -->
    <rect x="20" y="14" width="13" height="4" rx="1"/>
    
    <!-- Middle horizontal bar -->
    <rect x="20" y="31" width="10" height="3.5" rx="1"/>
  </g>
  
  <!-- Clarity crosshair center -->
  <circle cx="32" cy="32" r="2" fill="currentColor"/>
  <line x1="32" y1="26" x2="32" y2="38" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <line x1="26" y1="32" x2="38" y2="32" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
</svg>
